<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#auraGrad)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#a78bfa" stroke-width="4" opacity="0.3" filter="url(#glow)" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.15" />
  
  <!-- Aura Equalizer Waves -->
  <g fill="url(#waveGrad)">
    <rect x="136" y="216" width="24" height="80" rx="12" />
    <rect x="176" y="166" width="24" height="180" rx="12" />
    <rect x="216" y="126" width="24" height="260" rx="12" />
    <rect x="256" y="96" width="24" height="320" rx="12" />
    <rect x="296" y="146" width="24" height="220" rx="12" />
    <rect x="336" y="186" width="24" height="140" rx="12" />
    <rect x="376" y="226" width="24" height="60" rx="12" />
  </g>
</svg>
